name: Build APK 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 自动定位项目目录并编译
        run: |
          echo "=== 当前仓库文件结构 ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          # 自动查找包含 settings.gradle 或 settings.gradle.kts 的目录
          PROJECT_DIR=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ 错误：整个仓库中都没有找到 settings.gradle 或 settings.gradle.kts 文件！"
            exit 1
          fi
          
          echo "✅ 找到项目根目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Cine4K-Player-APK
          path: '**/build/outputs/apk/debug/*.apk'
