name: Build APK 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 编译并打包 APK
        run: |
          # 排除 .github 目录，精准寻找含有 settings.gradle 的真正项目根目录
          PROJECT_DIR=$(find . -maxdepth 3 -not -path '*/.*' \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ 未找到 settings.gradle，打印当前目录结构："
            find . -maxdepth 2
            exit 1
          fi
          
          echo "✅ 锁定真实项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 如果没有 gradlew 就自动生成
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Cine4K-Player-APK
          path: '**/build/outputs/apk/debug/*.apk'
