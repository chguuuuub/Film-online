name: Build APK 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 自动初始化项目
        run: |
          mkdir -p app/src/main/java/com/cine/player app/src/main
          
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
          echo 'rootProject.name = "Cine4K"; include(":app")' >> settings.gradle.kts

          echo 'plugins { id("com.android.application") version "8.1.4" apply false; id("org.jetbrains.kotlin.android") version "1.9.10" apply false }' > build.gradle.kts

          echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }' > app/build.gradle.kts
          echo 'android { namespace = "com.cine.player"; compileSdk = 34; defaultConfig { applicationId = "com.cine.player"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }' >> app/build.gradle.kts
          echo 'dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("androidx.media3:media3-exoplayer:1.2.0"); implementation("androidx.media3:media3-ui:1.2.0") }' >> app/build.gradle.kts

          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="Cine4K" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          echo 'package com.cine.player' > app/src/main/java/com/cine/player/MainActivity.kt
          echo 'import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import androidx.media3.exoplayer.ExoPlayer; import androidx.media3.ui.PlayerView' >> app/src/main/java/com/cine/player/MainActivity.kt
          echo 'class MainActivity : AppCompatActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); val pv = PlayerView(this); setContentView(pv); ExoPlayer.Builder(this).build().also { pv.player = it } } }' >> app/src/main/java/com/cine/player/MainActivity.kt

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 使用 Gradle 8.4 编译
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          arguments: assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Cine4K-Player-APK
          path: '**/build/outputs/apk/debug/*.apk'
