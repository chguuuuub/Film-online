name: Build APK 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 写入 SDK 路径
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 生成 Gradle Wrapper 补偿文件
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: 编译并打包 APK
        run: |
          # 如果你的项目在子目录，这里会自动切换进去（如果代码本身就在根目录，可删掉 cd 这一行）
          if [ -d "Film-online" ]; then
            cd Film-online
          fi
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Cine4K-Player-APK
          path: **/build/outputs/apk/debug/*.apk
